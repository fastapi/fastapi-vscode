name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      date:
        description: Release date in YYYY-MM-DD format. Defaults to today.
        required: false
        type: string

permissions: {}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare release
        env:
          BUMP: ${{ inputs.bump }}
          DATE: ${{ inputs.date }}
        run: node scripts/prepare-release.mjs prepare "$BUMP" "$DATE"
      - name: Get release version
        id: release-version
        run: |
          set -euo pipefail
          version="$(node scripts/prepare-release.mjs current-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Get PR Submit token
        id: pr-submit
        uses: tiangolo/pr-submit@d802fdf59bde80bc3eb8bd3259f4cbeec63de4aa # 0.0.1
      - name: Create release pull request
        env:
          GH_TOKEN: ${{ steps.pr-submit.outputs.token }}
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail
          branch="release-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "pr-submit[bot]"
          git config user.email "pr-submit[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json CHANGELOG.md
          git commit -m "🔖 Release version ${VERSION}"
          gh auth setup-git
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "🔖 Release version ${VERSION}" \
            --body "Prepare release ${VERSION}." \
            --label release
